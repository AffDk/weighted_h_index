[project]
name = "weighted-h-index"
version = "0.1.0"
description = "Context-aware weighted h-index using LLM-derived citation relevance on abstracts"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
    "typer>=0.12",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-dotenv>=1.0",
]

[project.scripts]
weighted-h-index = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.8",
]
